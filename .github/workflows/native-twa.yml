name: Native Android TWA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build Web
        run: npm run build
      - name: Build TWA
        run: echo "Simulating TWA build"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-twa-debug
          path: dist/
